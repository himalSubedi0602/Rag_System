# Source of truth for the test set. Build + validate with:  python -m src.testset
# The builder checks every quote against the corpus, finds gold chunks, assigns the
# tune/test split and writes eval/questions.jsonl plus two review files.
#
# evidence: [{doc, quote}]  quote = exact supporting text (matching ignores case, whitespace,
#                           curly vs straight quotes and markdown * _ ` characters)
# absent:   [{pattern, scope}]  no_answer only: regex that must match NOTHING in docs whose
#                           doc_id starts with scope ("" = whole corpus)

no_answer_text: "I couldn't find this in the documents."

