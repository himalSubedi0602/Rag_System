run_name: hybrid_rerank30
seed: 42
paths:
  sources: data/sources.yaml
  raw_dir: data/raw
  synthetic_dir: data/synthetic
  processed_dir: data/processed
  chroma_dir: data/chroma
  questions: eval/questions.jsonl
  results_dir: eval/results
chunking:
  strategy: fixed
  chunk_size: 500
  chunk_overlap: 50
  min_section_tokens: 50
  add_prefix: false
  tokenizer: sentence-transformers/all-MiniLM-L6-v2
embedding:
  model: BAAI/bge-small-en-v1.5
retrieval:
  mode: hybrid
  top_k_each: 30
  rrf_k: 60
  final_k: 5
  version_filter: none
  date_aware_rerank: false
  max_per_version_group: 0
  two_stage: false
  two_stage_docs: 3
  small_to_big: false
  piece_size: 250
  piece_overlap: 25
reranker:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidates: 30
  max_length: 512
generation:
  backend: ollama
  model: llama3.1:8b
  temperature: 0.0
  decline_threshold: null
eval:
  split: tune
  ks:
  - 1
  - 3
  - 5
  diagnostic_depths:
  - 30
  - 100
