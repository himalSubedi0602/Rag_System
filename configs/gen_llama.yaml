# Phase 8 generation run: final Phase 7 retrieval (hybrid RRF k=60 + date-aware w=0.1) -> llama3.1:8b, prompt v1.
# Decline threshold left unset: run 10 applies each pre-registered candidate to the same answers.
run_name: gen_llama
device: cpu
embedding:
  model: BAAI/bge-small-en-v1.5
retrieval:
  mode: hybrid
  rrf_k: 60
  date_aware_rerank: true
  date_weight: 0.1
generation:
  model: llama3.1:8b
  judge_model: qwen2.5:7b
