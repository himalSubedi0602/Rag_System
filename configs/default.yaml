# Default settings shared by every experiment.
# An experiment YAML lists ONLY the keys it changes; load_config() merges it on top of this file.
# Keys not defined here are rejected, so a typo like "chunk_sise" fails loudly.

run_name: default
seed: 42
# Where the embedding model and cross-encoder run: auto (Apple GPU / CUDA if available) or cpu.
# Generation runs use cpu: Ollama holds the shared GPU memory on this 8 GB machine.
device: auto

paths:
  sources: data/sources.yaml   # corpus source list (committed)
  raw_dir: data/raw
  synthetic_dir: data/synthetic  # hand-made old policy versions (committed)
  processed_dir: data/processed
  chroma_dir: data/chroma
  questions: eval/questions.jsonl
  results_dir: eval/results

chunking:
  strategy: fixed          # fixed | heading
  chunk_size: 500          # max tokens per chunk (heading strategy splits longer sections)
  chunk_overlap: 50        # tokens shared between neighbouring chunks
  min_section_tokens: 50   # heading strategy: smaller sections are merged into the next one
  add_prefix: false        # prepend "doc title > section" to each chunk before embedding / BM25
  # Tokenizer used to COUNT tokens. Kept fixed across experiments so swapping the embedding
  # model (run 5) doesn't also change chunk boundaries. MiniLM and bge-small share this vocabulary.
  tokenizer: sentence-transformers/all-MiniLM-L6-v2

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

retrieval:
  mode: vector             # vector | hybrid (vector + BM25 merged with RRF)
  top_k_each: 30           # candidates taken from each retriever
  rrf_k: 60                # constant in reciprocal rank fusion
  final_k: 5               # chunks passed on after (optional) reranking
  version_filter: none     # none | exclude_superseded (run 8) | exclude_legacy (run 8b): removed before search
  date_aware_rerank: false # run 9: score' = (1 - w) * rank-based relevance + w * corpus-scaled recency
  date_weight: 0.25        # w for date_aware_rerank (pre-registered values 0.1 / 0.25 / 0.5)
  version_swap: false      # run 9b: replace superseded chunks with the current version's most similar chunk
  max_per_version_group: 0  # run 6b: at most this many chunks per version_group in the results (0 = off)
  two_stage: false         # run 12: top documents first, then rerank chunks only within them
  two_stage_docs: 3
  small_to_big: false      # run 2b: search small pieces of each chunk, return the parent chunk
  piece_size: 250          # tokens per searchable piece (small_to_big only)
  piece_overlap: 25

reranker:
  enabled: false
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidates: 30           # how many first-stage results the cross-encoder re-scores (run 7: 30, run 7b: 100)
  max_length: 512          # the cross-encoder reads at most this many tokens (question + chunk)

generation:
  backend: ollama          # one function wraps the LLM call so this can be swapped later
  model: llama3.1:8b       # generator (Phase 8 pre-registration; fallback qwen2.5:7b at most once)
  judge_model: qwen2.5:7b  # judge for non-numeric answers only; never the generator's own model
  ollama_url: http://localhost:11434
  temperature: 0.0
  seed: 42
  num_ctx: 8192            # Ollama's default context is too small for 5 x 500-token chunks + prompt
  max_tokens: 512          # cap on reply length (Ollama num_predict); stops a looping reply from hanging the run
  context_chunks: 5        # top retrieved chunks passed to the LLM
  prompt_version: 1        # at most 2 versions (pre-registered)
  decline_threshold: null  # cross-encoder score on (question, top-1 chunk); null = the LLM decides alone
  decline_percentiles: [2.5, 5, 10]   # run 10 candidates: percentiles of answerable tune top-1 scores

eval:
  split: tune              # tune | test (test is used once, at the very end)
  ks: [1, 3, 5]
  diagnostic_depths: [30, 100]   # chunk recall at these depths: is the answer in the candidate pool at all?
