# Default settings shared by every experiment.
# An experiment YAML lists ONLY the keys it changes; load_config() merges it on top of this file.
# Keys not defined here are rejected, so a typo like "chunk_sise" fails loudly.

run_name: default
seed: 42

paths:
  sources: data/sources.yaml   # corpus source list (committed)
  raw_dir: data/raw
  synthetic_dir: data/synthetic  # hand-made old policy versions (committed)
  processed_dir: data/processed
  chroma_dir: data/chroma
  questions: eval/questions.jsonl
  results_dir: eval/results

chunking:
  strategy: fixed          # fixed | heading
  chunk_size: 500          # max tokens per chunk (heading strategy splits longer sections)
  chunk_overlap: 50        # tokens shared between neighbouring chunks
  min_section_tokens: 50   # heading strategy: smaller sections are merged into the next one
  add_prefix: false        # prepend "doc title > section" to each chunk before embedding / BM25
  # Tokenizer used to COUNT tokens. Kept fixed across experiments so swapping the embedding
  # model (run 5) doesn't also change chunk boundaries. MiniLM and bge-small share this vocabulary.
  tokenizer: sentence-transformers/all-MiniLM-L6-v2

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

retrieval:
  mode: vector             # vector | hybrid (vector + BM25 merged with RRF)
  top_k_each: 30           # candidates taken from each retriever
  rrf_k: 60                # constant in reciprocal rank fusion
  final_k: 5               # chunks passed on after (optional) reranking
  version_filter: none     # none | current_only
  date_aware_rerank: false
  small_to_big: false      # run 2b: search small pieces of each chunk, return the parent chunk
  piece_size: 250          # tokens per searchable piece (small_to_big only)
  piece_overlap: 25

reranker:
  enabled: false
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

generation:
  backend: ollama          # one function wraps the LLM call so this can be swapped later
  model: llama3.1:8b       # placeholder; chosen in Phase 8
  temperature: 0.0
  decline_threshold: null  # null = never decline; tuned in run 10

eval:
  split: tune              # tune | test (test is used once, at the very end)
  ks: [1, 3, 5]
  diagnostic_depths: [30, 100]   # chunk recall at these depths: is the answer in the candidate pool at all?
