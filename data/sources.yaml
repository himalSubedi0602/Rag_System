# Corpus source list. Committed to git; the downloaded files in data/raw/ are NOT.
# Download:  python -m src.download_data
# Ingest:    python -m src.ingest

# ---------------------------------------------------------------
# GitLab public handbook (markdown), https://gitlab.com/gitlab-com/content-sites/handbook
# ---------------------------------------------------------------
handbook:
  project: gitlab-com/content-sites/handbook
  ref: main
  base_path: content/handbook
  # Pattern rules: "dir/" = everything under dir; "dir/*.md" = files directly in dir only;
  # anything else = one exact file.
  include:
    - people-policies/
    - total-rewards/
    - hiring/
    - finance/
    - legal/
    - security/policies_and_standards/
    - security/security-and-technology-policies/
    - security/security-and-technology-policy-exception.md
    - security/security-assurance/
    - security/product-security/vulnerability-management/
    - support/*.md
    - support/license-and-renewals/

# ---------------------------------------------------------------
# Simulated access control (used by the role picker in Phase 9; evaluation ignores it).
# A user can see a document if their role is in access_roles, or access_roles has "all_employees".
# ---------------------------------------------------------------
access_roles:
  default: [all_employees]
  by_department:
    legal: [legal]
    finance: [finance]

# ---------------------------------------------------------------
# Public policy PDFs from UK / NZ public bodies and universities.
# id         -> saved as data/raw/pdfs/<id>.pdf, doc_id becomes "pdf:<id>"
# title      -> organisation is part of the title, since several orgs have similar policies
# updated_date (optional) -> otherwise taken from the PDF's modification date
# version_group / is_current (optional) -> set only for real old/current pairs
# ---------------------------------------------------------------
pdfs:
