# Minimal-edit outdated versions. Each entry produces data/synthetic/<file>.md:
# a FULL copy of the current page with ONLY these facts changed and an earlier date.
# Regenerate with:  python -m src.make_synthetic     (then re-run ingestion)
#
# replace: [current text, old text]   every listed current text must occur in the page

- file: expenses-2023
  source: hb:finance/expenses
  date: "2023-03-01"
  replace:
    - ["Expense claims over 90 days", "Expense claims over 60 days"]
    - ["up to $300 USD (or equivalent local currency) inclusive of tax per night", "up to $250 USD (or equivalent local currency) inclusive of tax per night"]
    - ["$300 USD limit", "$250 USD limit"]
    - ["$300USD/night", "$250USD/night"]
    - ["up to $120 USD (or local equivalent currency) per day", "up to $100 USD (or local equivalent currency) per day"]
    - ["International: At least 21 days in advance", "International: At least 30 days in advance"]
    - ["Parking and tolls  at $150 limit per day.", "Parking and tolls  at $100 limit per day."]
    - ["Limit is set to $60/year.", "Limit is set to $40/year."]
    - ["Dry cleaning is allowable if the stay is over 5 days.", "Dry cleaning is allowable if the stay is over 7 days."]
    - ["will need to have manager approval attached to the claim", "will need to have VP approval attached to the claim"]   # rule: approval level
    - ["then Manager and Finance approval", "then Manager approval"]   # rule: approval level
    - ["Room service is allowable as a meal", "Room service is not reimbursable as a meal"]   # rule: allowed -> not allowed
    - ["Cash or cash equivalents, such as gift cards, are not allowed", "Cash is not allowed, but gift cards are allowed"]   # rule: not allowed -> allowed
    - ["then the most senior Team Member present should pay the bill", "then the Team Member who organised the meal should pay the bill"]   # rule: who pays
    - ["Pre-Approval is needed prior to submitting claims.", "Pre-Approval is optional prior to submitting claims."]   # rule: required -> optional

